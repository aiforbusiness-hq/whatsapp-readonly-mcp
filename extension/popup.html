<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AI for Business Chat Assistant</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <img class="logo" src="icons/icon48.png" alt="">
      <div>
        <div class="eyebrow">AI for Business</div>
        <div class="title">Chat Assistant</div>
        <div class="sub note"><span>只读，绝不发送</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l8.5 3.2V12c0 5.3-3.7 8.6-8.5 10-4.8-1.4-8.5-4.7-8.5-10V5.2z" fill="#25d366"/><path d="M8.3 12.2l2.6 2.6 5-5.2" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      </div>
    </div>
    <div class="top-right">
      <span id="claude" class="conn warn" role="status">连接中…</span>
    </div>
  </header>

  <section id="pairBox" class="pair" hidden>
    <label for="code" class="pair-label">配对码</label>
    <div class="pair-row">
      <input id="code" inputmode="numeric" maxlength="9" autocomplete="off" aria-describedby="pairHint">
      <button id="pairBtn" class="btn primary">配对</button>
    </div>
    <p id="pairHint" class="hint">在 AI（Claude 或 ChatGPT）里问「WhatsApp 状态」，它会给你 6 位数配对码（3 分钟内有效）。</p>
    <p class="hint">请让电脑开着，Chrome 和 WhatsApp Web 也保持打开，AI 才读得到。</p>
    <p id="pairMsg" class="hint" aria-live="polite"></p>
  </section>

  <nav class="tabs" role="tablist" aria-label="分类">
    <button role="tab" class="tab active" data-tab="waiting" aria-selected="true">等我回 <span class="count" id="nWaiting">–</span></button>
    <button role="tab" class="tab" data-tab="drafts" aria-selected="false">AI 草稿 <span class="count" id="nDrafts">–</span></button>
    <button role="tab" class="tab" data-tab="all" aria-selected="false">全部 <span class="count" id="nAll">–</span></button>
    <button id="dash" class="refresh" aria-label="打开仪表板" title="在 WhatsApp Web 里打开仪表板">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
    </button>
    <button id="refresh" class="refresh" aria-label="重新读取" title="重新读取">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
    </button>
  </nav>

  <div class="search" id="searchRow">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="kw" type="search" aria-label="搜对话" placeholder="搜对话名称 / 内容">
  </div>

  <div id="status" class="status" aria-live="polite"></div>
  <ul id="list" class="list"></ul>

  <footer class="foot">
    <span class="note" id="noteTick"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1.8 12.6l4.3 4.3L15 8" fill="none" stroke="#53bdeb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 16.6l.3.3L19.8 8" fill="none" stroke="#53bdeb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>打开对话会标已读，对方会看到蓝勾。</span></span>
    <span class="note" id="noteLocal" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><g transform="rotate(45 12 12)"><rect x="9" y="1.5" width="6" height="3.2" rx="1" fill="#f472b6"/><rect x="9" y="4.7" width="6" height="1.4" fill="#cbd5e1"/><rect x="9" y="6.1" width="6" height="11" fill="#3b82f6"/><rect x="9" y="6.1" width="2" height="11" fill="#60a5fa"/><path d="M9 17.1h6l-3 5.4z" fill="#f1c9a0"/><path d="M11 20.7h2l-1 1.8z" fill="#334155"/></g></svg><span>草稿只存在这台电脑，保留 90 天。</span></span>
    <button id="clearDrafts" class="link" hidden>清空草稿</button>
  </footer>

  <script src="i18n.js"></script>
  <script type="module" src="popup.js"></script>
</body>
</html>
