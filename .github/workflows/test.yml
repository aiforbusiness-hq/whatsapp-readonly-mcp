name: tests

on:
  push:
    branches: [main]
  pull_request:

# Read-only: the tests need no secrets and write nothing back.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Zero dependencies: nothing to install. The full Chrome download test (tests/download.e2e.mjs)
      # needs a Chromium that allows --load-extension and skips itself here; run it locally before a release.
      - name: Unit and integration tests
        env:
          CI: "true"
        run: node --test tests/*.test.mjs
